<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Результат сканирования</title>
  <style>
    /* --- ЦВЕТОВЫЕ ПЕРЕМЕННЫЕ (СВЕТЛАЯ ТЕМА) --- */
    :root {
      --bg-body: #f2f4f7;
      --bg-card: #ffffff;
      --text-main: #1a1a1a;
      --text-muted: #7a7a7a;
      --blue-accent: #0066ff;
      --green-accent: #1f9d63;
      --border-color: transparent;
      --shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
    }

    /* --- ЦВЕТОВЫЕ ПЕРЕМЕННЫЕ (ТЕМНАЯ ТЕМА) --- */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-body: #000000;
        --bg-card: #262626;
        --text-main: #ffffff;
        --text-muted: #9e9e9e;
        --blue-accent: #3b82f6;
        --green-accent: #34d399;
        --border-color: #333333;
        --shadow: none;
      }
    }

    * { 
      box-sizing: border-box; 
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-body);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* Эмуляция экрана телефона */
    .app-container {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .header {
      padding: 24px 20px 16px;
    }

    .header h1 {
      margin: 0;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .content {
      flex: 1;
      padding: 0 16px 32px 16px;
    }

    /* Карточка результата в стиле списков из скриншота */
    .result-card {
      background-color: var(--bg-card);
      border-radius: 20px;
      padding: 24px 20px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
      text-align: center;
      transition: background-color 0.3s ease;
    }

    .icon-wrap {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: rgba(52, 211, 153, 0.15);
      color: var(--green-accent);
    }

    .icon-wrap svg {
      width: 32px;
      height: 32px;
    }

    .result-card h2 {
      margin: 0 0 8px;
      font-size: 20px;
      font-weight: 700;
    }

    .subtitle {
      margin: 0 0 24px;
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.4;
    }

    /* Внутренний список данных */
    .info-list {
      text-align: left;
      background: var(--bg-body);
      border-radius: 16px;
      padding: 4px 16px;
      margin-bottom: 24px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      padding: 14px 0;
      font-size: 15px;
      border-bottom: 1px solid var(--border-color);
    }

    .row:last-child {
      border-bottom: 0;
    }

    .row span:first-child { color: var(--text-muted); }
    .row span:last-child { font-weight: 600; text-align: right; }

    .pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      background: rgba(52, 211, 153, 0.15);
      color: var(--green-accent);
    }

    /* Кнопки */
    .actions { 
      display: grid; 
      gap: 12px; 
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 16px;
      padding: 16px;
      font: inherit;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s ease, transform 0.1s ease;
    }

    button:active { transform: scale(0.98); }

    .primary { 
      background: var(--blue-accent); 
      color: #ffffff; 
    }

    /* Экран закрытия */
    .closed-screen {
      position: fixed;
      inset: 0;
      background-color: var(--bg-body);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      z-index: 100;
      text-align: center;
    }

    .closed-screen.visible { display: flex; }
    
    .closed-screen h2 { margin: 16px 0 8px; font-size: 22px; }
    .closed-screen p { color: var(--text-muted); margin-bottom: 24px; font-size: 15px; line-height: 1.5; }
    
    .countdown { font-weight: 700; color: var(--text-main); }
  </style>
</head>
<body>

  <div class="app-container">
    <header class="header">
      <h1>Результат</h1>
    </header>

    <main class="content">
      <div class="result-card">
        <div class="icon-wrap" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 6L9 17l-5-5"/>
          </svg>
        </div>

        <h2>Проверка пройдена</h2>
        <p class="subtitle">Результат сканирования QR-кода.</p>

        <div class="info-list">
          <div class="row">
            <span>Тип проверки</span>
            <span>18+</span>
          </div>
          <div class="row">
            <span>Результат</span>
            <span><span class="pill">Успешно</span></span>
          </div>
          <div class="row">
            <span>Способ</span>
            <span>QR-код</span>
          </div>
          <div class="row">
            <span>Время</span>
            <span id="time">—</span>
          </div>
        </div>

        <div class="actions">
          <button class="primary" id="close">Понятно</button>
        </div>
      </div>
      
      <p style="text-align: center; color: var(--text-muted); font-size: 12px; margin-top: 20px;">
        Эта страница автоматически закроется через <span class="countdown" id="autoclose-timer">10</span> сек.
      </p>
    </main>
  </div>

  <!-- Экран после автозакрытия -->
  <div class="closed-screen" id="closed-screen">
    <div class="icon-wrap" style="background: rgba(0, 102, 255, 0.15); color: var(--blue-accent);">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 6L6 18M6 6l12 12"/>
      </svg>
    </div>
    <h2>Страница закрыта</h2>
    <p>Сессия завершена автоматически.<br>Переход через <span class="countdown" id="redirect-timer">5</span> сек.</p>
    <button class="primary" style="max-width: 200px;" id="restart">Открыть снова</button>
  </div>

  <script>
    const timeEl = document.getElementById("time");
    const autocloseTimerEl = document.getElementById("autoclose-timer");
    const redirectTimerEl = document.getElementById("redirect-timer");
    const closedScreen = document.getElementById("closed-screen");

    const AUTOCLOSE_SECONDS = 10;
    const REDIRECT_SECONDS = 5;
    const REDIRECT_URL = "about:blank";

    let autocloseLeft = AUTOCLOSE_SECONDS;
    let autocloseInterval = null;
    let redirectInterval = null;
    let closed = false;

    function setTime() {
      const now = new Date();
      timeEl.textContent = now.toLocaleTimeString("ru-RU", {
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    setTime();

    function closePage() {
      if (closed) return;
      closed = true;
      clearInterval(autocloseInterval);

      closedScreen.classList.add("visible");

      try { window.close(); } catch (e) {}

      let redirectLeft = REDIRECT_SECONDS;
      redirectTimerEl.textContent = String(redirectLeft);

      redirectInterval = setInterval(() => {
        redirectLeft -= 1;
        redirectTimerEl.textContent = String(Math.max(redirectLeft, 0));

        if (redirectLeft <= 0) {
          clearInterval(redirectInterval);
          try {
            window.location.replace(REDIRECT_URL);
          } catch (e) {
            window.location.href = REDIRECT_URL;
          }
        }
      }, 1000);
    }

    function startAutoclose() {
      clearInterval(autocloseInterval);
      autocloseLeft = AUTOCLOSE_SECONDS;
      autocloseTimerEl.textContent = String(autocloseLeft);

      autocloseInterval = setInterval(() => {
        autocloseLeft -= 1;
        autocloseTimerEl.textContent = String(Math.max(autocloseLeft, 0));
        if (autocloseLeft <= 0) closePage();
      }, 1000);
    }

    startAutoclose();

    document.getElementById("close").addEventListener("click", closePage);
    document.getElementById("restart").addEventListener("click", () => window.location.reload());
  </script>
</body>
</html>
